name: "Estudio Joven - Incorporar fuente nativa (una vez)"

on:
  push:
    branches:
      - feature/reconstruccion-fuente-nativa
    paths:
      - .github/workflows/01-importar-fuente.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estudio-joven-bootstrap-fuente
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Obtener rama de trabajo sin modificar main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Comprobar si existe la fuente nativa
        id: present
        shell: bash
        run: |
          if [ -f src/Cargo.toml ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Obtener Concat original fijado
        if: steps.present.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: jub0t/Concat
          ref: 2756209a92766a4e4726999a51648349a272c159
          path: .concat-original
          persist-credentials: false
      - name: Importar solo una vez como archivos fuente versionados
        if: steps.present.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/reconstruccion-fuente-nativa"
          test -f .concat-original/Cargo.toml
          test -f .concat-original/LICENSE
          test -f .concat-original/src/crates/concat/src/lib.rs
          rm -rf .concat-original/.git
          mkdir -p src
          cp -a .concat-original/. src/
          rm -rf .concat-original
          test -f src/LICENSE
          test -f src/Cargo.toml
          test -f src/src/crates/concat/src/lib.rs
          # No patches or replacement scripts are executed on source code.
          git add -- src
          if git diff --cached --quiet; then
            echo "No se encontraron archivos nuevos para incorporar."
            exit 1
          fi
          git config user.name "Estudio Joven CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: incorporar Concat original como fuente nativa versionada"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validar procedencia y arbol
        shell: bash
        run: |
          set -euo pipefail
          test -f src/LICENSE
          test -f src/Cargo.toml
          test -f src/src/crates/concat/src/lib.rs
          test ! -e patches/text-motion.patch
          echo "Fuente nativa incorporada; no se ejecutaron scripts de parcheo." >> "$GITHUB_STEP_SUMMARY"
