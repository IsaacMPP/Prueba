name: Construir FilmCraft con Whisper para Windows

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/compilar-filmcraft-whisper.yml

permissions:
  contents: read

jobs:
  compilar:
    name: FilmCraft con IA local - Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Obtener codigo oficial de FilmCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          ref: main
          path: filmcraft-source
          persist-credentials: false

      - name: Preparar Rust en GitHub
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Compilar el editor con Whisper
        shell: pwsh
        working-directory: filmcraft-source
        run: cargo build --release --locked -p filmcraft --features whisper

      - name: Preparar ejecutable y licencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path entrega -Force | Out-Null
          Copy-Item -LiteralPath 'filmcraft-source/target/release/filmcraft.exe' -Destination 'entrega/filmcraft.exe'
          Copy-Item -LiteralPath 'filmcraft-source/LICENSE-MIT' -Destination 'entrega/LICENSE-MIT'
          Copy-Item -LiteralPath 'filmcraft-source/LICENSE-APACHE' -Destination 'entrega/LICENSE-APACHE'
          Copy-Item -LiteralPath 'filmcraft-source/NOTICE' -Destination 'entrega/NOTICE'
          Copy-Item -LiteralPath 'filmcraft-source/ATTRIBUTION.md' -Destination 'entrega/ATTRIBUTION.md'

      - name: Publicar editor descargable
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-Whisper-Windows
          path: entrega/
          if-no-files-found: error
          retention-days: 14
