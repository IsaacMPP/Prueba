
          foreach ($nombre in @('LICENSE-MIT', 'LICENSE-APACHE', 'LICENSE', 'NOTICE', 'ATTRIBUTION.md')) {
            $origen = "filmcraft-source/$nombre"
            if (Test-Path -LiteralPath $origen) {
              Copy-Item -LiteralPath $origen -Destination "$destino/$nombre" -Force
            }
          }

          # Listas de lineas, sin here-strings que puedan invalidar el YAML.
          $instrucciones = @(
            'FILMCRAFT CON IA LOCAL - PRUEBA PARA ESTUDIO JOVEN'
            ''
            'Esta es una compilacion experimental del editor FilmCraft original.'
            'Whisper esta habilitado desde la compilacion de Rust.'
            ''
            '1. Extrae todos los archivos del ZIP.'
            '2. Abre ABRIR_EDITOR_UNICO.bat o filmcraft.exe.'
            '3. Carga un video y busca las herramientas de transcripcion.'
            '4. Descarga el modelo que pida FilmCraft, si corresponde.'
            '5. Prueba la creacion, edicion y exportacion de subtitulos.'
            ''
            'IMPORTANTE: la IA de esta compilacion usa Candle, no whisper.cpp.'
            'El archivo ggml-small.bin anterior NO se reutiliza automaticamente.'
            'Esta version conserva la interfaz y marca original de FilmCraft.'
            ''
            'Fuente: https://github.com/storytold/filmcraft'
          )
          $instrucciones | Set-Content -LiteralPath "$destino/LEEME-AL-ABRIR.txt" -Encoding utf8

          $iniciador = @(
            '@echo off'
            'setlocal'
            'cd /d "%~dp0"'
            'if not exist "filmcraft.exe" ('
            '  echo No se encontro filmcraft.exe en esta carpeta.'
            '  pause'
            '  exit /b 1'
            ')'
            'start "" "%~dp0filmcraft.exe"'
          )
          $iniciador | Set-Content -LiteralPath "$destino/ABRIR_EDITOR_UNICO.bat" -Encoding ascii

          $commit = (git -C filmcraft-source rev-parse HEAD).Trim()
          "FilmCraft original: storytold/filmcraft`nCommit: $commit" | Set-Content -LiteralPath "$destino/ORIGEN.txt" -Encoding utf8
          $sha = (Get-FileHash -LiteralPath "$destino/filmcraft.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  filmcraft.exe" | Set-Content -LiteralPath "$destino/SHA256.txt" -Encoding ascii

          $archivo = 'output/FilmCraft_IA_Integrada_Windows.zip'
          Compress-Archive -Path "$destino/*" -DestinationPath $archivo -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $archivo)) {
            throw 'No se genero el ZIP final.'
          }
          Get-Item -LiteralPath $archivo | Select-Object FullName, Length

      - name: Publicar archivo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-Whisper-Integrado-Windows
          path: output/FilmCraft_IA_Integrada_Windows.zip
          if-no-files-found: error
          retention-days: 14
