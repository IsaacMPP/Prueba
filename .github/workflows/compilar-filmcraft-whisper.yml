name: Estudio Joven - FilmCraft con subtitulos inteligentes (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/compilar-filmcraft-whisper.yml
      - estudio-joven.patch

permissions:
  contents: read

jobs:
  compilar:
    name: FilmCraft nativo + Whisper + opciones de subtitulos
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Obtener parche de Estudio Joven
        uses: actions/checkout@v4

      - name: Obtener FilmCraft original
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          ref: main
          path: filmcraft-source
          persist-credentials: false

      - name: Aplicar mejoras nativas de subtitulos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'estudio-joven.patch'
          if (-not (Test-Path -LiteralPath $patch)) { throw 'Falta estudio-joven.patch en la raiz del repositorio Prueba.' }
          git -C filmcraft-source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'El parche no coincide con el FilmCraft actual. Comparar la version del codigo y actualizar el parche.' }
          git -C filmcraft-source apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo aplicar el parche.' }

      - name: Instalar Rust en GitHub (no en tu PC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Probar separacion inteligente de subtitulos
        shell: pwsh
        working-directory: filmcraft-source
        run: |
          cargo test --locked -p filmcraft-edit estudio_joven
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de subtitulos.' }

      - name: Compilar editor unico con Whisper
        shell: pwsh
        working-directory: filmcraft-source
        run: |
          cargo build --release --locked -p filmcraft --features whisper
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar FilmCraft.' }

      - name: Preparar FilmCraft Windows y avisos legales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path entrega -Force | Out-Null
          $exe = 'filmcraft-source/target/release/filmcraft.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'No se genero filmcraft.exe' }
          Copy-Item -LiteralPath $exe -Destination 'entrega/filmcraft.exe'
          foreach ($file in @('LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md')) {
            $source = Join-Path 'filmcraft-source' $file
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path 'entrega' $file)
            }
          }
          'Compilacion experimental FilmCraft con Whisper y ajustes de subtitulos. No incluye modelos. Ver licencias incluidas.' | Set-Content -LiteralPath 'entrega/LEEME.txt' -Encoding UTF8

      - name: Publicar aplicacion descargable
        uses: actions/upload-artifact@v4
        with:
          name: Estudio-Joven-FilmCraft-Windows-IA
          path: entrega/
          if-no-files-found: error
          retention-days: 14
